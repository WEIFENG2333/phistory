name: Capture prompts

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: capture-prompts-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GH_TOKEN: ${{ github.token }}
  CAPTURE_AGENTS: claude-code,codex,dsh,antigravity,grok,minimax-code,kimi-code,mimo,openclaw,hermes,kimi,opencode,pi,omp

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --all-groups
      - run: uv run ruff format --check phistory tests
      - run: uv run ruff check phistory tests
      - run: uv run pytest
      - run: uv build
      - name: Capture latest prompts
        id: latest
        run: |
          set +e
          uv run phistory capture --latest --agents "$CAPTURE_AGENTS" --summary-title "Latest capture"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Extract Claude Code static prompts
        id: static
        run: |
          set +e
          uv run phistory extract-static claude-code --latest-captured 10
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Translate archived prompts
        id: translation
        env:
          PHISTORY_TRANSLATION_API_KEY: ${{ secrets.PHISTORY_TRANSLATION_API_KEY }}
          PHISTORY_TRANSLATION_BASE_URL: ${{ vars.PHISTORY_TRANSLATION_BASE_URL }}
          PHISTORY_TRANSLATION_MODEL: ${{ vars.PHISTORY_TRANSLATION_MODEL }}
        run: |
          if [ -z "$PHISTORY_TRANSLATION_API_KEY" ]; then
            echo "::warning::Translation is not configured; publishing original prompts."
            echo "status=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          uv run phistory translate --latest-captured 10 --max-batches 200 --usage-log "$RUNNER_TEMP/translation-usage.jsonl"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save translation usage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: translation-usage
          path: ${{ runner.temp }}/translation-usage.jsonl
          if-no-files-found: ignore
          retention-days: 30
      - name: Save translated dictionaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: translation-dictionaries
          path: translations/zh-CN/
          if-no-files-found: ignore
          retention-days: 30
      - run: uv run phistory render-index
      - run: uv run phistory render-site
      - name: Commit capture updates
        run: |
          git add README.md README_zh.md index.html llms.txt docs captures
          if [ -d translations ]; then git add translations; fi
          if git diff --cached --quiet; then
            echo "No capture changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Capture latest prompt snapshots"
          git push
      - name: Smoke capture
        if: github.event_name == 'workflow_dispatch'
        run: uv run phistory --root /tmp/phistory-smoke --cache-dir /tmp/phistory-smoke-cache capture --latest --agents "$CAPTURE_AGENTS" --force --summary-title "Smoke capture"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && always()
        with:
          name: smoke-captures
          path: /tmp/phistory-smoke
          retention-days: 7
      - name: Report capture failures
        if: always() && (steps.latest.outputs.status != '0' || steps.static.outputs.status != '0' || steps.translation.outputs.status != '0')
        run: |
          echo "::error title=Prompt archive workflow incomplete::Check the preceding logs for failed or skipped capture, static extraction, translation and commit steps."
          echo "Pages will deploy the artifacts available on main, including any partial results successfully committed by this run."
          exit 1
