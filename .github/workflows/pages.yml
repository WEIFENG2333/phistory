name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Capture prompts"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --frozen
      - name: Build site from archived data
        run: uv run phistory build-site --output .phistory-cache/site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .phistory-cache/site
      - id: deployment
        uses: actions/deploy-pages@v4
